# golangci-lint v2 configuration. Run locally with `make lint`.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G304 # reading user-supplied file paths is the point of `csg ingest`
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: tools/
        linters: [gosec]
formatters:
  enable:
    - gofmt
