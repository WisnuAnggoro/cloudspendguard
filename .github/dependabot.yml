# Unit 7 (v0.9.0-rc1): automated dependency updates. Weekly checks for the
# Go modules and the GitHub Actions workflows. Renovate (renovate.json)
# covers the Docker base image and the pinned LocalStack acceptance image.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-actions:
        update-types: [minor, patch]
