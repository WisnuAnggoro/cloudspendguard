name: CI

# Units 4 to 6 (v0.6.0-beta): lint, cross-platform test matrix with the race
# detector, coverage upload and gate, static cross-compilation (NFR4),
# vulnerability scan, an end-to-end smoke run that also validates the SARIF
# output against the official schema, a container image build (pushed to GHCR
# on version tags), and a manually triggered SARIF upload to GitHub code scanning.

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which splits
    # -coverprofile=coverage.out at the dot and passes ".out" to go test as a
    # package name. Bash behaves the same on all three operating systems.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gate for analyzers and core algorithms (NFR3, 90%)
        if: matrix.os == 'ubuntu-latest'
        run: make cover-gate
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Static build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          ext=""; if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/csg-${GOOS}-${GOARCH}${ext}" ./cmd/csg
      - uses: actions/upload-artifact@v4
        with:
          name: csg-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          retention-days: 7

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run the demo against bundled sample data
        run: make demo
      - name: Render all four report formats from the embedded sample
        run: |
          make build
          for f in html md json sarif; do ./bin/csg run --sample --quiet --report "tmp/report.$f"; done
          test -s tmp/report.html
      - name: Validate SARIF against the OASIS 2.1.0 schema
        run: |
          python3 -m pip install -r scripts/requirements-sarif.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_sarif.py tmp/report.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reports
          path: tmp/report.*
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image and smoke-test it
        run: |
          docker build -t csg:ci --build-arg VERSION="${GITHUB_REF_NAME}" .
          docker run --rm csg:ci version
          docker run --rm csg:ci run --sample --quiet --top 3
      - name: Log in to GHCR (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/cloudspendguard"
          docker tag csg:ci "${image}:${GITHUB_REF_NAME#v}"
          docker push "${image}:${GITHUB_REF_NAME#v}"

  code-scanning:
    needs: smoke
    # Manual only: the fixtures are deliberately insecure, so uploading them
    # on every push would fill the Security tab with intentional alerts.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Scan the repository's own Terraform fixtures
        run: |
          make build
          ./bin/csg run --input testdata/eval --quiet --sarif-uri testdata/eval/main.tf --report csg.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: csg.sarif
          category: cloudspendguard

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action always installs govulncheck@latest, which needs a recent
      # Go toolchain, so run it on the latest stable Go rather than GO_VERSION.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
